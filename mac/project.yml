name: BestASR

options:
  bundleIdPrefix: app.mindloom
  createIntermediateGroups: true
  defaultConfig: Debug
  deploymentTarget:
    macOS: "14.2"
  minimumXcodeGenVersion: 2.45.3
  xcodeVersion: "27.0"

configs:
  Debug: debug
  Release: release
  # Mindloom Preview (v11): a Release (optimized) build with its own identity
  # (com.bestasr.mindloom.preview, kept on 10-6: a development identity, not
  # the product's), defaults domain, URL scheme, extension IDs
  # and data root, so it runs beside the installed bestASR app and never
  # opens the real library. MINDLOOM_PREVIEW (not DEBUG) gates the preview's
  # data root and its verification hooks (App/LiveShots.swift). See
  # App/Info-Preview.plist and FOUNDATION.md.
  Preview: release

settings:
  base:
    # The product's identity, set here only (owner's decision 2026-10-06:
    # app.mindloom; com.mindloom.app was taken). The App, its share
    # extension, inference worker and MCP helper derive their bundle ids from
    # it; the development build adds .debug. The same value is
    # MindloomIdentity.bundleID in the code and MINDLOOM_PHONE_BUNDLE_ID in
    # iOS/project.yml (MindloomIdentityTests keeps them equal).
    MINDLOOM_BUNDLE_ID: app.mindloom
    ARCHS: arm64
    BESTASR_GIT_REVISION: uncommitted
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    CURRENT_PROJECT_VERSION: 3
    DEAD_CODE_STRIPPING: YES
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "14.2"
    MARKETING_VERSION: 0.2.0
    ONLY_ACTIVE_ARCH: YES
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"
  configs:
    # A stable signature, so Accessibility and Input Monitoring survive
    # rebuilds of the preview (ad-hoc signing changes the hash every build).
    # The signing team is never committed: pass DEVELOPMENT_TEAM=<team id> on
    # the xcodebuild command line (script/signing_team.sh reads the paid team
    # from Xcode's accounts; script/build_release.sh does this for Release).
    Preview:
      CODE_SIGN_IDENTITY: "Apple Development"
      CODE_SIGN_STYLE: Manual
      PROVISIONING_PROFILE_SPECIFIER: ""

packages:
  BestASRCore:
    path: Packages/BestASRCore
  MindloomLink:
    path: Packages/MindloomLink
  MindloomDesign:
    path: Packages/MindloomDesign
  # 「从网络补充信息」 (PRD LOOKUP-001–003): the web lookup and its one network exit.
  MindloomLookup:
    path: Packages/MindloomLookup

targets:
  BestASR:
    type: application
    platform: macOS
    deploymentTarget: "14.2"
    sources:
      - path: App
      - path: config/inference-candidates.json
        buildPhase: resources
      - path: config/model-artifacts.json
        buildPhase: resources
      - path: Legal
        buildPhase: resources
      - path: THIRD-PARTY-NOTICES.md
        buildPhase: resources
      # The Chrome extension 「收进织机」 (V8 contract A6), copied as a folder
      # to Contents/Resources/chrome-extension for Chrome's "load unpacked".
      - path: integrations/chrome-extension
        type: folder
        buildPhase: resources
    dependencies:
      - package: BestASRCore
        product: BestASRCore
      - package: BestASRCore
        product: BestASRDictation
      - package: BestASRCore
        product: BestASRDomain
      - package: BestASRCore
        product: BestASRPersistence
      - package: BestASRCore
        product: BestASRAudioJournal
      - package: BestASRCore
        product: BestASRMacAudio
      - package: BestASRCore
        product: BestASRProcessTapProbe
      - package: BestASRCore
        product: BestASRDelivery
      - package: BestASRCore
        product: BestASRInference
      - package: BestASRCore
        product: BestASRMacPermissions
      - package: BestASRCore
        product: BestASRMacUI
      - package: BestASRCore
        product: BestASRCandidateAdapters
      - package: BestASRCore
        product: BestASRFluidRuntime
      - package: BestASRCore
        product: BestASRQwenRuntime
      - package: BestASRCore
        product: BestASRModelManager
      - package: BestASRCore
        product: BestASRPortableArchiveProbe
      - package: BestASRCore
        product: BestASRMLXRuntime
      - package: BestASRCore
        product: BestASRProcessing
      - package: BestASRCore
        product: BestASRRecognition
      - package: BestASRCore
        product: BestASRSpeakerRouting
      - package: BestASRCore
        product: BestASRRemoteOrganizer
      - package: BestASRCore
        product: BestASRIntake
      - package: BestASRCore
        product: BestASRMemory
      - package: BestASRCore
        product: BestASRMemoryUI
      - package: BestASRCore
        product: BestASRAgentAccess
      - package: BestASRCore
        product: MindloomAgentProtocol
      - package: MindloomLink
        product: MindloomSpaces
      # The v10 design kit (tokens, type, motion, mark, listener).
      - package: MindloomDesign
        product: MindloomDesign
      # v8 entries (Settings → 入口, V8 contract §A).
      - package: BestASRCore
        product: BestASREntries
      - package: BestASRCore
        product: MindloomShareDrop
      # 入口 › 腾讯会议 (ENTRY-013): the bundled tmeet, its login, fetching.
      - package: BestASRCore
        product: MindloomTencentMeeting
      # v12: which library a launch opens, demo mode, the product time zone.
      - package: BestASRCore
        product: MindloomLibrary
      # v12: 「从网络补充信息」 (PRD LOOKUP-001–003).
      - package: MindloomLookup
        product: MindloomLookup
      # The switch from bestASR (10-6): the keychain items its helper hands over.
      - package: BestASRCore
        product: MindloomCarryOver
      - package: MindloomLink
        product: MindloomIdentity
      - target: InferenceWorker
        embed: true
      # The share extension 「收进织机」 (V8 contract A1), in Contents/PlugIns.
      - target: MindloomShare
        embed: true
        codeSign: true
      # The MCP helper agents start over stdio (AGENT-CONTRACT §1).
      - target: MindloomMCP
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    # tmeet (third_party/tencentmeeting-cli, ENTRY-013): TencentCloud's
    # tencentmeeting-cli built from pinned source with Mindloom's patches,
    # signed with the App's identity and the hardened runtime, at
    # Contents/Helpers/tmeet. The Go build reads its module cache, so this
    # target's scripts are not sandboxed.
    postBuildScripts:
      - name: Bundle tmeet
        script: |
          "${SRCROOT}/script/bundle_tmeet.sh"
        inputFiles:
          - $(SRCROOT)/script/bundle_tmeet.sh
          - $(SRCROOT)/script/build_tmeet.sh
          - $(SRCROOT)/third_party/tencentmeeting-cli/VERSION
          - $(SRCROOT)/third_party/tencentmeeting-cli/upstream.sha256
          - $(SRCROOT)/third_party/tencentmeeting-cli/patches/0001-disable-remote-crash-report.patch
          - $(SRCROOT)/third_party/tencentmeeting-cli/patches/0002-keep-login-when-refresh-fails-on-network.patch
          - $(SRCROOT)/third_party/tencentmeeting-cli/patches/0003-master-key-from-inherited-descriptor.patch
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/tmeet
        basedOnDependencyAnalysis: true
    settings:
      base:
        # The keychain-group variant (App/BestASR-KeychainGroup.entitlements) is chosen
        # only through the two settings below, which script/build_release.sh sets when
        # MINDLOOM_PROFILE_SPECIFIER names a Mac provisioning profile. They are read
        # by this target alone: CODE_SIGN_ENTITLEMENTS and PROVISIONING_PROFILE_SPECIFIER
        # are never passed on the command line, which would override every target
        # (the sandboxed share extension, the worker and the MCP helper included).
        CODE_SIGN_ENTITLEMENTS: App/BestASR$(MINDLOOM_ENTITLEMENTS_VARIANT).entitlements
        MINDLOOM_ENTITLEMENTS_VARIANT: ""
        MINDLOOM_APP_PROFILE_SPECIFIER: ""
        PROVISIONING_PROFILE_SPECIFIER: $(MINDLOOM_APP_PROFILE_SPECIFIER)
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        # The executable and the bundle are Mindloom (Activity Monitor, Finder);
        # the Swift module keeps its internal name (tests import it).
        PRODUCT_NAME: Mindloom
        PRODUCT_MODULE_NAME: bestASR
        MINDLOOM_DISPLAY_NAME: Mindloom
        MINDLOOM_URL_SCHEME: mindloom
      configs:
        # Debug (and any configuration but Release) never opens the owner's
        # library by default (App/MindloomLaunch.swift) and has its own URL
        # scheme, link state folder and share drop folder.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: $(MINDLOOM_BUNDLE_ID).debug
          MINDLOOM_URL_SCHEME: mindloom-debug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: $(MINDLOOM_BUNDLE_ID)
          # The product: the only build that opens the owner's library by default.
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "MINDLOOM_RELEASE"
        Preview:
          PRODUCT_BUNDLE_IDENTIFIER: com.bestasr.mindloom.preview
          INFOPLIST_FILE: App/Info-Preview.plist
          MINDLOOM_URL_SCHEME: mindloom-preview
          # Synthetic, marked; never the real library (App/PreviewEnvironment.swift).
          MINDLOOM_PREVIEW_DATA_ROOT: /Users/Shared/mindloom-demo/v11/env/preview-root
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "MINDLOOM_PREVIEW"

  InferenceWorker:
    type: xpc-service
    platform: macOS
    deploymentTarget: "14.2"
    sources:
      - path: InferenceWorker
    dependencies:
      - package: BestASRCore
        product: BestASRInferenceXPCProtocol
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: InferenceWorker/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(MINDLOOM_BUNDLE_ID).inference-worker
        PRODUCT_NAME: InferenceWorker
        SKIP_INSTALL: YES
      configs:
        Preview:
          PRODUCT_BUNDLE_IDENTIFIER: com.bestasr.mindloom.preview.inference-worker

  # mindloom-mcp: stdio MCP server that forwards to the running App over a
  # private Unix socket; bundled at Contents/Helpers/mindloom-mcp. The same
  # source builds as the SwiftPM product `mindloom-mcp` for its tests.
  MindloomMCP:
    type: tool
    platform: macOS
    deploymentTarget: "14.2"
    sources:
      - path: Packages/BestASRCore/Sources/MindloomMCPHelper
    dependencies:
      - package: BestASRCore
        product: MindloomAgentProtocol
    settings:
      base:
        # An embedded Info.plist gives the signature a stable identifier.
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(MINDLOOM_BUNDLE_ID).mcp
        PRODUCT_NAME: mindloom-mcp
        SKIP_INSTALL: YES
      configs:
        Preview:
          PRODUCT_BUNDLE_IDENTIFIER: com.bestasr.mindloom.preview.mcp

  # 收进织机: the macOS share extension (V8 contract A1). Sandboxed; it may
  # write only the library's share drop folder, which the App reads.
  MindloomShare:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.2"
    sources:
      - path: ShareExtension
        excludes:
          - "*.plist"
          - "*.entitlements"
    dependencies:
      - package: BestASRCore
        product: MindloomShareDrop
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: ShareExtension/MindloomShare.entitlements
        ENABLE_APP_SANDBOX: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ShareExtension/Info.plist
        PRODUCT_NAME: MindloomShare
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        MINDLOOM_URL_SCHEME: mindloom
        # The name in the Share menu (the preview's says it is the preview:
        # both can be registered at once; review of 10-6).
        MINDLOOM_SHARE_DISPLAY_NAME: Mindloom
        # Empty: the owner's library. The preview names its own root.
        MINDLOOM_SHARE_DROP_ROOT: ""
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: $(MINDLOOM_BUNDLE_ID).debug.share
          # Its own folder in the owner's home, never the owner's library.
          CODE_SIGN_ENTITLEMENTS: ShareExtension/MindloomShare-Debug.entitlements
          MINDLOOM_URL_SCHEME: mindloom-debug
          MINDLOOM_SHARE_DROP_ROOT: "~/Library/Application Support/Mindloom-debug-share-drop"
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: $(MINDLOOM_BUNDLE_ID).share
        Preview:
          PRODUCT_BUNDLE_IDENTIFIER: com.bestasr.mindloom.preview.share
          CODE_SIGN_ENTITLEMENTS: ShareExtension/MindloomShare-Preview.entitlements
          MINDLOOM_URL_SCHEME: mindloom-preview
          MINDLOOM_SHARE_DISPLAY_NAME: Mindloom 预览版
          # Outside every data root: the canonical synthetic root is never
          # written, and a preview on any copy of it reads this same folder.
          MINDLOOM_SHARE_DROP_ROOT: /Users/Shared/mindloom-demo/v11/env/share-drop

  InferenceXPCProbe:
    type: application
    platform: macOS
    deploymentTarget: "14.2"
    sources:
      - path: Spikes/SPIKE-XPC-001/ProbeApp
    dependencies:
      - package: BestASRCore
        product: BestASRInferenceXPCProtocol
      - package: BestASRCore
        product: BestASRAudioJournalProbe
      - target: InferenceWorker
        embed: true
    settings:
      base:
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: bestASR XPC Probe
        INFOPLIST_KEY_LSUIElement: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bestasr.spike.inference-xpc-probe
        PRODUCT_NAME: InferenceXPCProbe

  BenchCLI:
    type: tool
    platform: macOS
    deploymentTarget: "14.2"
    sources:
      - path: Tools/BenchCLI
    dependencies:
      - package: BestASRCore
        product: BestASRCore
      - package: BestASRCore
        product: BestASRBenchmark
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bestasr.bench-cli
        PRODUCT_NAME: BenchCLI

  ProcessTapProbe:
    type: application
    platform: macOS
    deploymentTarget: "14.2"
    sources:
      - path: Spikes/SPIKE-CAP-001/ProcessTapProbeApp
    dependencies:
      - package: BestASRCore
        product: BestASRProcessTapProbe
    settings:
      base:
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Spikes/SPIKE-CAP-001/ProcessTapProbeApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.bestasr.spike.process-tap-probe
        PRODUCT_NAME: ProcessTapProbe

  ProcessTapTCCDenialProbe:
    type: application
    platform: macOS
    deploymentTarget: "14.2"
    sources:
      - path: Spikes/SPIKE-CAP-001/ProcessTapTCCDenialProbeApp
    dependencies:
      - package: BestASRCore
        product: BestASRProcessTapProbe
      - target: SelectedWatermarkPlayer
    settings:
      base:
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Spikes/SPIKE-CAP-001/ProcessTapTCCDenialProbeApp/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.bestasr.spike.process-tap-tcc-denial-probe.v2
        PRODUCT_NAME: ProcessTapTCCDenialProbeV2

  SelectedWatermarkPlayer:
    type: application
    platform: macOS
    deploymentTarget: "14.2"
    sources:
      - path: Spikes/SPIKE-CAP-001/WatermarkPlayer
    settings:
      base:
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: bestASR Selected Watermark Player
        INFOPLIST_KEY_LSUIElement: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bestasr.spike.selected-watermark-player
        PRODUCT_NAME: SelectedWatermarkPlayer

  NonselectedWatermarkPlayer:
    type: application
    platform: macOS
    deploymentTarget: "14.2"
    sources:
      - path: Spikes/SPIKE-CAP-001/WatermarkPlayer
    settings:
      base:
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: bestASR Nonselected Watermark Player
        INFOPLIST_KEY_LSUIElement: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bestasr.spike.nonselected-watermark-player
        PRODUCT_NAME: NonselectedWatermarkPlayer

  WorkspaceSmokeTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.2"
    sources:
      - path: Tests/WorkspaceSmokeTests
    dependencies:
      - package: BestASRCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bestasr.workspace-smoke-tests

  BestASRAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.2"
    sources:
      - path: Tests/BestASRAppTests
    dependencies:
      - target: BestASR
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bestasr.app-tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Mindloom.app/Contents/MacOS/Mindloom"

  BestASRUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.2"
    sources:
      - path: UITests/BestASRUITests
    dependencies:
      - target: BestASR
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.bestasr.ui-tests
        TEST_TARGET_NAME: BestASR

schemes:
  BestASR:
    build:
      targets:
        BestASR: all
        InferenceWorker: all
        MindloomMCP: all
        MindloomShare: all
        BenchCLI: all
        ProcessTapProbe: all
        ProcessTapTCCDenialProbe: all
        InferenceXPCProbe: all
        SelectedWatermarkPlayer: all
        NonselectedWatermarkPlayer: all
        WorkspaceSmokeTests: [test]
        BestASRAppTests: [test]
        BestASRUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # Off: with coverage on, Xcode instruments every Debug build of the
      # scheme, and the instrumented mindloom-mcp then writes default.profraw
      # wherever it is started — Chrome starts it inside the App bundle,
      # which broke the bundle's seal (V8 A6). Pass -enableCodeCoverage YES
      # to xcodebuild test when a coverage report is wanted.
      gatherCoverageData: false
      targets:
        - name: WorkspaceSmokeTests
          parallelizable: true
        - name: BestASRAppTests
          parallelizable: false
        - name: BestASRUITests
          parallelizable: false

  # Mindloom Preview (v11): the App alone, built with the Preview
  # configuration. /Volumes/<build-volume>/mac-build/v11-preview.sh builds it.
  Mindloom Preview:
    build:
      targets:
        BestASR: all
    run:
      config: Preview
    profile:
      config: Preview
    analyze:
      config: Preview
    archive:
      config: Preview

  BenchCLI:
    build:
      targets:
        BenchCLI: all
    run:
      config: Debug

  ProcessTapProbe:
    build:
      targets:
        ProcessTapProbe: all
        SelectedWatermarkPlayer: all
        NonselectedWatermarkPlayer: all
    run:
      config: Debug

  ProcessTapTCCDenialProbe:
    build:
      targets:
        ProcessTapTCCDenialProbe: all
        SelectedWatermarkPlayer: all
    run:
      config: Debug

  InferenceXPCProbe:
    build:
      targets:
        InferenceXPCProbe: all
        InferenceWorker: all
    run:
      config: Debug
