<body><div class="content"><h1>关于开展2026年首台套申报工作的通知</h1>
<p>各有关单位：为做好2026年首台套重大技术装备申报工作，现将有关事项通知如下。</p>
<p>一、申报截止日期：2026年4月30日17:00。逾期不予受理。</p>
<p>二、申报材料请通过网上系统提交，纸质材料不再另行报送。</p>
