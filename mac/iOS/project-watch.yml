# Mindloom on Apple Watch (PRD WATCH-001–008): records, and hands each recording to the iPhone,
# which keeps the original and transcribes it. Included by project.yml when PHONE_WATCH=YES (the
# default of iOS/script/generate_project.sh). The watch app links MindloomWatchHandoff only: no
# networking, no recognizer, nothing that reads what was said.
targets:
  MindloomWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Watch
      - path: WatchShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MINDLOOM_PHONE_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: MindloomWatch
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Watch/Info.plist
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "CODE_SIGN_IDENTITY[sdk=watchsimulator*]": "-"
        SKIP_INSTALL: YES
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Mindloom
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # A single-target watch app that needs its iPhone app (the iPhone keeps and transcribes).
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(MINDLOOM_PHONE_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: false
        # Keeps recording with the wrist down once started in the foreground (WATCH-002).
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Mindloom 使用麦克风录制你开始的录音。录音发送到你的 iPhone，在 iPhone 上转写为文字。
        # The complication opens mindloom://record (start recording at once).
        CFBundleURLTypes:
          - CFBundleURLName: $(MINDLOOM_PHONE_BUNDLE_ID).watchkitapp
            CFBundleURLSchemes: [mindloom]
    dependencies:
      - package: MindloomWatchHandoff
        product: MindloomWatchHandoff
      - target: MindloomWatchWidgets
        embed: true

  MindloomWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: WatchWidgets
      - path: WatchShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MINDLOOM_PHONE_BUNDLE_ID).watchkitapp.widgets
        PRODUCT_NAME: MindloomWatchWidgets
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: WatchWidgets/Info.plist
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "26.0"
        APPLICATION_EXTENSION_API_ONLY: YES
        "CODE_SIGN_IDENTITY[sdk=watchsimulator*]": "-"
        SKIP_INSTALL: YES
    info:
      path: WatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Mindloom
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  MindloomWatchUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: Tests/MindloomWatchUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MINDLOOM_PHONE_BUNDLE_ID).watchkitapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "4"
        TEST_TARGET_NAME: MindloomWatch
        "CODE_SIGN_IDENTITY[sdk=watchsimulator*]": "-"
    dependencies:
      - target: MindloomWatch

  MindloomPhone:
    dependencies:
      - target: MindloomWatch
        embed: true

schemes:
  MindloomPhone:
    build:
      targets:
        MindloomWatch: all
  MindloomWatch:
    build:
      targets:
        MindloomWatch: all
        MindloomWatchWidgets: all
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MindloomWatchUITests
    run:
      config: Debug
      executable: MindloomWatch
