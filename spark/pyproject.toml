[project]
name = "organizer"
version = "0.1.0"
description = "Spark-side organizer for a private voice-and-memory app: events from intake items via Agent Skills"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "httpx>=0.27",
  "pyyaml>=6.0",
  # file-read parsers (licenses and network behavior: docs/FILE_READ.md)
  "defusedxml>=0.7.1",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "pypdfium2>=4.30",
  "pillow>=10.0",
  "olefile>=0.46",
]

[project.scripts]
zhiji-inbox = "organizer.inbox_cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "pypdf>=4", "xlwt>=1.3"]

[tool.setuptools]
packages = ["organizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
